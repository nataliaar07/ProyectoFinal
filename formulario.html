        <div class="collage-side">
            <div class="collage-grid">

                    <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=500&q=80" alt="Valorant">

                    <input type="password" name="password" placeholder="Ingresar contraseña" required>
